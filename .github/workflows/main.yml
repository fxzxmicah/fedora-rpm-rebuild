name: Rebuild and Upload

on:
  push:
    paths:
      - SOURCES/**
      - SPECS-PATCHES/**
  workflow_dispatch:
    inputs:
      packages:
        description: Perform operation of
        required: true
        type: string

permissions:
  issues: write

jobs:
  job:
    runs-on: ubuntu-latest
    container: fedora:${{ github.ref_name }}

    steps:
    - name: Install Dependencies
      run: |
        rm /usr/share/dnf5/repos.d/fedora-cisco-openh264.repo
        dnf install -y git-core rpmdevtools python3-copr python3-libdnf5

    - name: Configure Macros
      run: |
        cat > ~/.rpmmacros <<EOF
        # Different with "github.workspace" in container environment
        %_topdir ${GITHUB_WORKSPACE}
        EOF

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    # Workaround
    - name: Set safe directory
      run: git config --global --add safe.directory ${GITHUB_WORKSPACE}

    - name: Get Packages
      run: |
        case "${{ inputs.packages }}" in
          "" )
            mapfile -t packages < <({
              git diff-tree --diff-filter=AM --no-commit-id --name-only -r HEAD -- SPECS-PATCHES
              git diff-tree --diff-filter=AM --no-commit-id --name-only -r HEAD -- SOURCES | sed -E "s|.*/||" | grep -rlFf - SPECS-PATCHES/*.patch 2>/dev/null
            } | sed -E "s|.*/||; s/\.patch\$//" | sort -u)
            ;;
          "_all" )
            mapfile -t packages < <(find SPECS-PATCHES -name "*.patch" -exec basename -s .patch {} +)
            ;;
          * )
            packages=()
            for pkg in ${{ inputs.packages }}; do
              if [ -f "SPECS-PATCHES/${pkg}.patch" ]; then
                packages+=("${pkg}")
              else
                echo "::warning::Patch not found for: ${pkg}"
              fi
            done
            ;;
        esac

        if [ ${#packages[@]} -eq 0 ]; then
          echo "::warning::No packages to build."
        else
          echo "::notice::Packages to build: ${packages[@]}"
          echo "packages=${packages[@]}" >> ${GITHUB_ENV}
        fi

    - name: Rebuild SRPM
      if: env.packages
      run: |
        success=()
        failure=()
        dnf download --source ${packages}
        rpm -ivh *.src.rpm
        for pkg in ${packages}; do
          echo "Apply patch for ${pkg}"
          sed -i "s/[[:space:]]\+\$//" SPECS/${pkg}.spec
          if git apply --directory SPECS -C 1 -p 1 SPECS-PATCHES/${pkg}.patch 2>/dev/null; then
            echo "Patch applied successfully for ${pkg}"
            spectool --get-files --sourcedir SPECS/${pkg}.spec
            rpmbuild -bs SPECS/${pkg}.spec
            success+=("${pkg}")
          else
            echo "Patch applied failed for ${pkg}"
            failure+=("${pkg}")
          fi
        done
        if [ ${#success[@]} -ne 0 ]; then
          echo "::notice::Successfully rebuilt packages: ${success[@]}"
          echo "success=${success[@]}" >> ${GITHUB_ENV}
        fi
        if [ ${#failure[@]} -ne 0 ]; then
          echo "::error::Failed to rebuild packages: ${failure[@]}"
          echo "failure=${failure[@]}" >> ${GITHUB_ENV}
        fi

    - name: Export API
      if: env.success
      run: echo "${{ secrets.COPR_API }}" > copr-api

    - name: Upload Copr
      if: env.success
      run: |
        from graphlib import TopologicalSorter
        from pathlib import Path
        from copr.v3 import Client
        import libdnf5
        import platform
        import subprocess


        HOUR = 60 * 60
        DEFAULT_TIMEOUT = 24 * HOUR
        TIMEOUT_MARGIN = 2 * HOUR


        def query_lines(*args):
            return {
                line.strip()
                for line in subprocess.check_output(args, text=True).splitlines()
                if line.strip()
            }


        def source_buildrequires(srpm):
            source_name = subprocess.check_output(
                ("rpm", "-qp", "--qf", "%{NAME}\\n", str(srpm)),
                text=True,
            ).strip()
            if not source_name:
                raise RuntimeError(f"Cannot determine source package name: {srpm}")

            # BuildRequires become regular Requires in the source RPM.
            buildrequires = query_lines(
                "rpm", "-qp", "--requires", str(srpm)
            )
            return source_name, buildrequires


        def create_solver():
            """Load only available repositories, without the host RPM database."""
            base = libdnf5.base.Base()
            config = base.get_config()
            base.load_config()
            config.plugins = False
            config.install_weak_deps = False
            config.optional_metadata_types = ["filelists"]
            config.skip_unavailable = False
            base.setup()

            repo_sack = base.get_repo_sack()
            repo_sack.create_repos_from_system_configuration()
            repo_sack.load_repos(libdnf5.repo.Repo.Type_AVAILABLE)
            return base


        def resolve_build_dependencies(base, package, buildrequires, selected):
            """Return selected sources in the resolved build environment."""
            goal = libdnf5.base.Goal(base)
            # Only this source RPM supplies BuildRequires. DNF resolves the
            # requested binaries and their strong Requires, using no other SRPMs.
            for requirement in sorted(buildrequires):
                # These describe RPM features, not installable build dependencies.
                if requirement.startswith("rpmlib("):
                    continue
                goal.add_install(requirement)

            transaction = goal.resolve()
            if transaction.get_problems() != libdnf5.base.GoalProblem_NO_PROBLEM:
                logs = transaction.get_resolve_logs_as_strings()
                details = "\n".join(f"  {line}" for line in logs)
                if not details:
                    details = "  libdnf5 returned no diagnostic messages"
                raise RuntimeError(
                    f"Cannot resolve BuildRequires for {package}:\n{details}"
                )

            dependencies = set()
            for transaction_package in transaction.get_transaction_packages():
                binary = transaction_package.get_package()
                source_name = binary.get_source_name()
                if source_name in selected and source_name != package:
                    dependencies.add(source_name)
            return dependencies


        def dependency_groups(dependencies):
            """Find strongly connected components with Tarjan's algorithm."""
            indices = {}
            lowlinks = {}
            stack = []
            active = set()
            groups = []

            def visit(package):
                indices[package] = lowlinks[package] = len(indices)
                stack.append(package)
                active.add(package)

                for dependency in sorted(dependencies[package]):
                    if dependency not in indices:
                        visit(dependency)
                        lowlinks[package] = min(
                            lowlinks[package], lowlinks[dependency]
                        )
                    elif dependency in active:
                        lowlinks[package] = min(
                            lowlinks[package], indices[dependency]
                        )

                if lowlinks[package] == indices[package]:
                    group = []
                    while True:
                        member = stack.pop()
                        active.remove(member)
                        group.append(member)
                        if member == package:
                            break
                    groups.append(tuple(sorted(group)))

            for package in sorted(dependencies):
                if package not in indices:
                    visit(package)
            return groups


        def build_batches(dependencies):
            """Order strongly connected groups into parallel build batches."""
            groups = dependency_groups(dependencies)
            group_for = {
                package: group for group in groups for package in group
            }
            sorter = TopologicalSorter({
                group: {
                    group_for[dependency]
                    for package in group
                    for dependency in dependencies[package]
                } - {group}
                for group in groups
            })
            sorter.prepare()

            batches = []
            while sorter.is_active():
                ready = sorter.get_ready()
                batches.append(sorted(ready))
                sorter.done(*ready)
            return batches


        def build_timeout(client, owner, project, package):
            longest = None
            builds = client.build_proxy.get_list(owner, project, package)
            for build in builds:
                try:
                    started = int(build.get("started_on"))
                    ended = int(build.get("ended_on"))
                except (TypeError, ValueError):
                    continue
                if ended >= started:
                    longest = max(longest or 0, ended - started)

            return (
                DEFAULT_TIMEOUT if longest is None else longest + TIMEOUT_MARGIN
            )


        def submit_batches(
            client, owner, project, chroot, batches, srpms, timeouts
        ):
            batch_id = None
            for batch in batches:
                batch_options = (
                    {"after_build_id": batch_id} if batch_id is not None else {}
                )
                for package in sorted(
                    package for group in batch for package in group
                ):
                    build = client.build_proxy.create_from_file(
                        ownername=owner,
                        projectname=project,
                        path=str(srpms[package]),
                        buildopts={
                            "chroots": [chroot],
                            "timeout": timeouts[package],
                            **batch_options,
                        },
                    )
                    print(
                        f"Submitted {package} as build {build.id} "
                        f"(timeout {timeouts[package]}s)"
                    )
                    # Any build in a Copr batch identifies the whole batch.
                    batch_id = build.id
                    batch_options = {"with_build_id": batch_id}


        def repository_info(client):
            repository = "${{ github.repository }}".split("/", 1)[1]
            parts = repository.split("-")
            project = "-".join(parts[1:])
            os_release = platform.freedesktop_os_release()
            chroot = "-".join(
                (os_release["ID"], os_release["VERSION_ID"], platform.machine())
            )
            return client.config["username"], project, chroot


        def main():
            srpms = {}
            buildrequires = {}
            for srpm in sorted(Path("SRPMS").glob("*.src.rpm")):
                source_name, required = source_buildrequires(srpm)
                if source_name in srpms:
                    raise RuntimeError(
                        f"Multiple SRPMs for source package {source_name}"
                    )
                srpms[source_name] = srpm
                buildrequires[source_name] = required

            if not srpms:
                raise RuntimeError("No SRPMs found")

            # Each source has an independent buildroot. Combine its selected
            # source dependencies only after resolving the binary transaction.
            solver = create_solver()
            dependencies = {
                package: resolve_build_dependencies(
                    solver, package, required, srpms
                )
                for package, required in buildrequires.items()
            }
            batches = build_batches(dependencies)

            for number, batch in enumerate(batches, start=1):
                packages = sorted(
                    package for group in batch for package in group
                )
                print(f"Copr batch {number}: {', '.join(packages)}")
                for group in batch:
                    if len(group) > 1:
                        print(
                            "  Dependency cycle (using available repository "
                            f"packages): {', '.join(group)}"
                        )

            client = Client.create_from_config_file("copr-api")
            owner, project, chroot = repository_info(client)
            timeouts = {
                package: build_timeout(client, owner, project, package)
                for package in srpms
            }
            submit_batches(
                client, owner, project, chroot, batches, srpms, timeouts
            )


        main()
      shell: python

    - name: Open Issue
      if: env.failure
      uses: actions/github-script@v8
      with:
        script: |
          const failure = process.env.failure.split(' ');
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Failed to rebuild some packages',
            body: `The following packages failed to rebuild:

          ${failure.map(pkg => `- ${pkg}`).join('\n')}

          Please check and update the patches.`,
            labels: ['ci'],
            assignees: [context.repo.owner],
          });
