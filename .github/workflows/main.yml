name: Rebuild and Upload

on:
  push:
    paths:
      - SOURCES/**
      - SPECS-PATCHES/**
  workflow_dispatch:
    inputs:
      packages:
        description: Perform operation of
        required: true
        type: string

permissions:
  issues: write

jobs:
  job:
    runs-on: ubuntu-latest
    container: fedora:${{ github.ref_name }}

    steps:
    - name: Install Dependencies
      run: |
        rm /etc/yum.repos.d/fedora-cisco-openh264.repo
        dnf install -y git-core rpmdevtools python3-copr python3-libdnf5

    - name: Configure Macros
      run: |
        cat > ~/.rpmmacros <<EOF
        # Different with "github.workspace" in container environment
        %_topdir ${GITHUB_WORKSPACE}
        EOF

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    # Workaround
    - name: Set safe directory
      run: git config --global --add safe.directory ${GITHUB_WORKSPACE}

    - name: Get Packages
      run: |
        case "${{ inputs.packages }}" in
          "" )
            mapfile -t packages < <({
              git diff-tree --diff-filter=AM --no-commit-id --name-only -r HEAD -- SPECS-PATCHES
              git diff-tree --diff-filter=AM --no-commit-id --name-only -r HEAD -- SOURCES | sed -E "s|.*/||" | grep -rlFf - SPECS-PATCHES/*.patch 2>/dev/null
            } | sed -E "s|.*/||; s/\.patch\$//" | sort -u)
            ;;
          "_all" )
            mapfile -t packages < <(find SPECS-PATCHES -name "*.patch" -exec basename -s .patch {} +)
            ;;
          * )
            packages=()
            for pkg in ${{ inputs.packages }}; do
              if [ -f "SPECS-PATCHES/${pkg}.patch" ]; then
                packages+=("${pkg}")
              else
                echo "::warning::Patch not found for: ${pkg}"
              fi
            done
            ;;
        esac

        if [ ${#packages[@]} -eq 0 ]; then
          echo "::warning::No packages to build."
        else
          echo "::notice::Packages to build: ${packages[@]}"
          echo "packages=${packages[@]}" >> ${GITHUB_ENV}
        fi

    - name: Rebuild SRPM
      if: env.packages
      run: |
        success=()
        failure=()
        dnf download --source ${packages}
        rpm -ivh *.src.rpm
        for pkg in ${packages}; do
          echo "Apply patch for ${pkg}"
          sed -i "s/[[:space:]]\+\$//" SPECS/${pkg}.spec
          if git apply --directory SPECS -C 1 -p 1 SPECS-PATCHES/${pkg}.patch 2>/dev/null; then
            echo "Patch applied successfully for ${pkg}"
            spectool --get-files --sourcedir SPECS/${pkg}.spec
            rpmbuild -bs SPECS/${pkg}.spec
            success+=("${pkg}")
          else
            echo "Patch applied failed for ${pkg}"
            failure+=("${pkg}")
          fi
        done
        if [ ${#success[@]} -ne 0 ]; then
          echo "::notice::Successfully rebuilt packages: ${success[@]}"
          echo "success=${success[@]}" >> ${GITHUB_ENV}
        fi
        if [ ${#failure[@]} -ne 0 ]; then
          echo "::error::Failed to rebuild packages: ${failure[@]}"
          echo "failure=${failure[@]}" >> ${GITHUB_ENV}
        fi

    - name: Export API
      if: env.success
      run: echo "${{ secrets.COPR_API }}" > copr-api

    - name: Upload Copr
      if: env.success
      run: |
        from pathlib import Path
        from copr.v3 import Client
        import libdnf5
        import platform
        import subprocess


        HOUR = 60 * 60
        DEFAULT_TIMEOUT = 24 * HOUR
        TIMEOUT_MARGIN = 2 * HOUR


        def query_lines(*args):
            return {
                line.strip()
                for line in subprocess.check_output(args, text=True).splitlines()
                if line.strip()
            }


        def package_metadata(srpm):
            source_name = subprocess.check_output(
                ("rpm", "-qp", "--qf", "%{NAME}\\n", str(srpm)),
                text=True,
            ).strip()
            if not source_name:
                raise RuntimeError(f"Cannot determine source package name: {srpm}")

            # BuildRequires become regular Requires in the source RPM.
            requirements = query_lines(
                "rpm", "-qp", "--requires", str(srpm)
            )
            return source_name, requirements


        def create_solver():
            """Load only available repositories, without the host RPM database."""
            base = libdnf5.base.Base()
            config = base.get_config()
            config.plugins = False
            base.load_config()
            config.install_weak_deps = False
            config.optional_metadata_types = ["filelists"]
            config.skip_unavailable = False
            base.setup()

            repo_sack = base.get_repo_sack()
            repo_sack.create_repos_from_system_configuration()
            repo_sack.load_repos(libdnf5.repo.Repo.Type_AVAILABLE)
            return base


        def resolve_build_environment(base, package, requirements):
            """Resolve one source package's complete BuildRequires transaction."""
            goal = libdnf5.base.Goal(base)
            for requirement in sorted(requirements):
                # These describe RPM features, not installable build dependencies.
                if requirement.startswith("rpmlib("):
                    continue
                goal.add_install(requirement)

            transaction = goal.resolve()
            if transaction.get_problems() != libdnf5.base.GoalProblem_NO_PROBLEM:
                logs = transaction.get_resolve_logs_as_strings()
                details = "\n".join(f"  {line}" for line in logs)
                if not details:
                    details = "  libdnf5 returned no diagnostic messages"
                raise RuntimeError(
                    f"Cannot resolve BuildRequires for {package}:\n{details}"
                )

            sources = set()
            for transaction_package in transaction.get_transaction_packages():
                source_name = transaction_package.get_package().get_source_name()
                if source_name:
                    sources.add(source_name)
            return sources


        def build_batches(build_environments, selected):
            dependencies = {
                package: (sources & selected) - {package}
                for package, sources in build_environments.items()
            }

            remaining = {
                package: set(deps) for package, deps in dependencies.items()
            }
            batches = []
            while remaining:
                batch = sorted(
                    package for package, deps in remaining.items() if not deps
                )
                if not batch:
                    cycle = "; ".join(
                        f"{package} -> {', '.join(sorted(deps))}"
                        for package, deps in sorted(remaining.items())
                    )
                    raise RuntimeError(
                        f"Dependency cycle among selected packages: {cycle}"
                    )

                batches.append(batch)
                completed = set(batch)
                remaining = {
                    package: deps - completed
                    for package, deps in remaining.items()
                    if package not in completed
                }

            return batches, dependencies


        def build_timeout(client, owner, project, package):
            longest = None
            builds = client.build_proxy.get_list(owner, project, package)
            for build in builds:
                try:
                    started = int(build.get("started_on"))
                    ended = int(build.get("ended_on"))
                except (TypeError, ValueError):
                    continue
                if ended >= started:
                    longest = max(longest or 0, ended - started)

            if longest is None:
                print(
                    f"Build timeout: {package}: {DEFAULT_TIMEOUT // HOUR}h "
                    "(no completed history)"
                )
                return DEFAULT_TIMEOUT

            timeout = longest + TIMEOUT_MARGIN
            print(
                f"Build timeout: {package}: {timeout}s "
                f"(longest historical runtime {longest}s "
                f"+ {TIMEOUT_MARGIN // HOUR}h)"
            )
            return timeout


        def submit_batches(
            client, owner, project, chroot, batches, srpms, timeouts
        ):
            previous_batch_id = None
            for number, batch in enumerate(batches, start=1):
                print(f"Copr batch {number}: {', '.join(batch)}")
                current_batch_id = None
                for package in batch:
                    buildopts = {
                        "chroots": [chroot],
                        "timeout": timeouts[package],
                    }
                    if current_batch_id is not None:
                        buildopts["with_build_id"] = current_batch_id
                    elif previous_batch_id is not None:
                        buildopts["after_build_id"] = previous_batch_id

                    build = client.build_proxy.create_from_file(
                        ownername=owner,
                        projectname=project,
                        path=str(srpms[package]),
                        buildopts=buildopts,
                    )
                    print(f"Submitted {package} as build {build.id}")
                    if current_batch_id is None:
                        current_batch_id = build.id

                previous_batch_id = current_batch_id


        def repository_info(client):
            repository = "${{ github.repository }}".split("/", 1)[1]
            parts = repository.split("-")
            project = "-".join(parts[1:])
            os_release = platform.freedesktop_os_release()
            chroot = "-".join(
                (os_release["ID"], os_release["VERSION_ID"], platform.machine())
            )
            return client.config["username"], project, chroot


        def main():
            srpms = {}
            requirements = {}
            for srpm in sorted(Path("SRPMS").glob("*.src.rpm")):
                source_name, required = package_metadata(srpm)
                if source_name in srpms:
                    raise RuntimeError(
                        f"Multiple SRPMs for source package {source_name}"
                    )
                srpms[source_name] = srpm
                requirements[source_name] = required

            if not srpms:
                raise RuntimeError("No SRPMs found")

            # Each source package gets an independent transaction whose roots
            # are all of its BuildRequires.  libdnf5 follows the strong runtime
            # Requires of the selected binary packages recursively.  Projecting
            # that transaction back to selected source names gives build order.
            solver = create_solver()
            build_environments = {
                package: resolve_build_environment(solver, package, required)
                for package, required in requirements.items()
            }

            batches, dependencies = build_batches(
                build_environments, set(srpms)
            )
            for package in sorted(dependencies):
                deps = ", ".join(sorted(dependencies[package])) or "none"
                print(f"Internal dependencies: {package}: {deps}")

            client = Client.create_from_config_file("copr-api")
            owner, project, chroot = repository_info(client)
            timeouts = {
                package: build_timeout(client, owner, project, package)
                for package in srpms
            }
            submit_batches(
                client, owner, project, chroot, batches, srpms, timeouts
            )


        main()
      shell: python

    - name: Open Issue
      if: env.failure
      uses: actions/github-script@v8
      with:
        script: |
          const failure = process.env.failure.split(' ');
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Failed to rebuild some packages',
            body: `The following packages failed to rebuild:

          ${failure.map(pkg => `- ${pkg}`).join('\n')}

          Please check and update the patches.`,
            labels: ['ci'],
            assignees: [context.repo.owner],
          });
