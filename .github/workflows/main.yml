name: Rebuild and Upload

on:
  push:
    paths:
      - SPECS-PATCHES/**
  workflow_dispatch:
    inputs:
      packages:
        description: Perform operation of
        required: true
        type: string

permissions:
  issues: write

jobs:
  job:
    runs-on: ubuntu-latest
    container: fedora:${{ github.ref_name }}

    steps:
    - name: Install Dependencies
      run: dnf install -y git-core rpmdevtools copr-cli

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    # Workaround
    - name: Set safe directory
      run: git config --global --add safe.directory ${GITHUB_WORKSPACE}

    - name: Get Packages
      run: |
        case "${{ inputs.packages }}" in
          "" )
            mapfile -t packages < <(git diff-tree --diff-filter=AM --no-commit-id --name-only -r HEAD -- SPECS-PATCHES | sed -E "s|.*/||; s/\.patch\$//")
            ;;
          "_all" )
            mapfile -t packages < <(find SPECS-PATCHES -name "*.patch" -exec basename {} .patch \;)
            ;;
          * )
            packages=()
            for pkg in ${{ inputs.packages }}; do
              if [ -f "SPECS-PATCHES/${pkg}.patch" ]; then
                packages+=("${pkg}")
              else
                echo "::warning::Patch not found for: ${pkg}"
              fi
            done
            ;;
        esac

        if [ ${#packages[@]} -eq 0 ]; then
          echo "::warning::No packages to build."
        else
          echo "::notice::Packages to build: ${packages[@]}"
          echo "packages=${packages[@]}" >> ${GITHUB_ENV}
        fi

    - name: Rebuild SRPM
      if: env.packages
      run: |
        success=()
        failure=()
        dnf download --source ${packages}
        rpm -ivh --define "_topdir ${GITHUB_WORKSPACE}" *.src.rpm
        for pkg in ${packages}; do
          echo "Apply patch for ${pkg}"
          sed -i "s/[[:space:]]\+\$//" SPECS/${pkg}.spec
          if git apply --directory SPECS -C 1 -p 1 SPECS-PATCHES/${pkg}.patch 2>/dev/null; then
            echo "Patch applied successfully for ${pkg}"
            spectool --define "_topdir ${GITHUB_WORKSPACE}" --get-files --sourcedir SPECS/${pkg}.spec
            rpmbuild --define "_topdir ${GITHUB_WORKSPACE}" -bs SPECS/${pkg}.spec
            success+=("${pkg}")
          else
            echo "Patch applied failed for ${pkg}"
            failure+=("${pkg}")
          fi
        done
        if [ ${#success[@]} -ne 0 ]; then
          echo "::notice::Successfully rebuilt packages: ${success[@]}"
          echo "success=${success[@]}" >> ${GITHUB_ENV}
        fi
        if [ ${#failure[@]} -ne 0 ]; then
          echo "::error::Failed to rebuild packages: ${failure[@]}"
          echo "failure=${failure[@]}" >> ${GITHUB_ENV}
        fi

    - name: Upload Copr
      if: env.success
      run: |
        echo "${{ secrets.COPR_API }}" > copr-api
        . /etc/os-release
        copr-cli --config copr-api build --nowait --timeout 86400 --chroot ${ID}-${VERSION_ID}-$(uname -m) $(echo ${GITHUB_REPOSITORY} | cut -d "-" -f 2-) SRPMS/*.src.rpm

    - name: Open Issue
      if: env.failure
      uses: actions/github-script@v8
      with:
        script: |
          const failure = process.env.failure.split(' ');
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Failed to rebuild some packages',
            body: `The following packages failed to rebuild:

            ${failure.map(pkg => `- ${pkg}`).join('\n')}

            Please check and update the patches.`,
            labels: ['ci'],
            assignees: [context.repo.owner],
          });
