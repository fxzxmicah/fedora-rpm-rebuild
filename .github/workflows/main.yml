name: Rebuild and Upload

on:
  push:
    paths:
      - SOURCES/**
      - SPECS-PATCHES/**
  workflow_dispatch:
    inputs:
      packages:
        description: Perform operation of
        required: true
        type: string

permissions:
  issues: write

jobs:
  job:
    runs-on: ubuntu-latest
    container: fedora:${{ github.ref_name }}

    steps:
    - name: Install Dependencies
      run: |
        rm /usr/share/dnf5/repos.d/fedora-cisco-openh264.repo
        dnf install -y git-core rpmdevtools python3-copr python3-libdnf5

    - name: Configure Macros
      run: |
        cat > ~/.rpmmacros <<EOF
        # Different with "github.workspace" in container environment
        %_topdir ${GITHUB_WORKSPACE}
        EOF

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    # Workaround
    - name: Set safe directory
      run: git config --global --add safe.directory ${GITHUB_WORKSPACE}

    - name: Get Packages
      run: |
        case "${{ inputs.packages }}" in
          "" )
            mapfile -t packages < <({
              git diff-tree --diff-filter=AM --no-commit-id --name-only -r HEAD -- SPECS-PATCHES
              git diff-tree --diff-filter=AM --no-commit-id --name-only -r HEAD -- SOURCES | sed -E "s|.*/||" | grep -rlFf - SPECS-PATCHES/*.patch 2>/dev/null
            } | sed -E "s|.*/||; s/\.patch\$//" | sort -u)
            ;;
          "_all" )
            mapfile -t packages < <(find SPECS-PATCHES -name "*.patch" -exec basename -s .patch {} +)
            ;;
          * )
            packages=()
            for pkg in ${{ inputs.packages }}; do
              if [ -f "SPECS-PATCHES/${pkg}.patch" ]; then
                packages+=("${pkg}")
              else
                echo "::warning::Patch not found for: ${pkg}"
              fi
            done
            ;;
        esac

        if [ ${#packages[@]} -eq 0 ]; then
          echo "::warning::No packages to build."
        else
          echo "::notice::Packages to build: ${packages[@]}"
          echo "packages=${packages[@]}" >> ${GITHUB_ENV}
        fi

    - name: Rebuild SRPM
      if: env.packages
      run: |
        success=()
        failure=()
        dnf download --source ${packages}
        rpm -ivh *.src.rpm
        for pkg in ${packages}; do
          echo "Apply patch for ${pkg}"
          sed -i "s/[[:space:]]\+\$//" SPECS/${pkg}.spec
          if git apply --directory SPECS -C 1 -p 1 SPECS-PATCHES/${pkg}.patch 2>/dev/null; then
            echo "Patch applied successfully for ${pkg}"
            spectool --get-files --sourcedir SPECS/${pkg}.spec
            rpmbuild -bs SPECS/${pkg}.spec
            success+=("${pkg}")
          else
            echo "Patch applied failed for ${pkg}"
            failure+=("${pkg}")
          fi
        done
        if [ ${#success[@]} -ne 0 ]; then
          echo "::notice::Successfully rebuilt packages: ${success[@]}"
          echo "success=${success[@]}" >> ${GITHUB_ENV}
        fi
        if [ ${#failure[@]} -ne 0 ]; then
          echo "::error::Failed to rebuild packages: ${failure[@]}"
          echo "failure=${failure[@]}" >> ${GITHUB_ENV}
        fi

    - name: Export API
      if: env.success
      run: echo "${{ secrets.COPR_API }}" > copr-api

    - name: Upload Copr
      if: env.success
      run: |
        from dataclasses import dataclass
        from graphlib import CycleError, TopologicalSorter
        from pathlib import Path
        import platform
        import subprocess
        import tomllib

        from copr.v3 import Client
        import libdnf5


        HOUR = 60 * 60
        DEFAULT_TIMEOUT = 24 * HOUR
        TIMEOUT_MARGIN = 2 * HOUR


        @dataclass
        class BuildDependencies:
            sources: set[str]
            unavailable: set[str]


        def rpm_query(srpm, *options):
            return subprocess.check_output(
                ("rpm", "-qp", *options, str(srpm)), text=True
            ).strip()


        def source_packages():
            srpms = {}
            for srpm in sorted(Path("SRPMS").glob("*.src.rpm")):
                source = rpm_query(srpm, "--qf", "%{NAME}")
                if source in srpms:
                    raise RuntimeError(f"Multiple SRPMs for source package {source}")
                srpms[source] = srpm
            if not srpms:
                raise RuntimeError("No SRPMs found")
            return srpms


        def load_build_config():
            with Path("workflows.toml").open("rb") as stream:
                config = tomllib.load(stream)
            sources = {path.stem for path in Path("SPECS-PATCHES").glob("*.patch")}
            providers = {}
            for source, capabilities in config["future_provides"].items():
                if source not in sources:
                    raise ValueError(f"Unknown future provider: {source}")
                for capability in capabilities:
                    if capability in providers:
                        raise ValueError(f"Duplicate future capability: {capability}")
                    providers[capability] = source
            cycle_heads = {
                head: {head, *members} for head, members in config["cycle_heads"].items()
            }
            for head, members in cycle_heads.items():
                if not members <= sources:
                    raise ValueError(f"Unknown sources in cycle {head}: {members - sources}")
            return providers, cycle_heads


        def create_solver(repositories):
            """Load build repositories without the host RPM database."""
            base = libdnf5.base.Base()
            base.load_config()
            config = base.get_config()
            config.plugins = False
            config.install_weak_deps = False
            config.optional_metadata_types = ["filelists"]
            config.skip_unavailable = False
            base.setup()

            repo_sack = base.get_repo_sack()
            repo_sack.create_repos_from_system_configuration()
            for definition in repositories:
                repo_config = repo_sack.create_repo(f"build-{definition['id']}").get_config()
                repo_config.baseurl = [definition["baseurl"]]
                for option in ("priority", "repo_gpgcheck"):
                    if definition.get(option) is not None:
                        setattr(repo_config, option, definition[option])
            repo_sack.load_repos(libdnf5.repo.Repo.Type_AVAILABLE)
            return base


        def resolve_dependencies(base, package, srpm, selected, providers):
            """Combine real buildroot dependencies with explicit future build edges."""
            goal = libdnf5.base.Goal(base)
            sources = set()
            unavailable = set()
            # An SRPM's Requires are its BuildRequires. DNF follows only the strong
            # runtime Requires of the binaries installed to satisfy these roots.
            for requirement in sorted(rpm_query(srpm, "--requires").splitlines()):
                if requirement.startswith("rpmlib("):
                    continue
                provider = providers.get(libdnf5.rpm.Reldep(base, requirement).get_name())
                if provider is not None:
                    sources.add(provider)
                    query = libdnf5.rpm.PackageQuery(base)
                    query.filter_provides(requirement)
                    if query.empty():
                        if provider not in selected or provider == package:
                            raise RuntimeError(
                                f"{package} requires {requirement}; {provider} must "
                                "already be built or included as another source in this run"
                            )
                        unavailable.add(provider)
                        continue
                goal.add_install(requirement)

            transaction = goal.resolve()
            if transaction.get_problems() != libdnf5.base.GoalProblem_NO_PROBLEM:
                raise RuntimeError(
                    f"Cannot resolve BuildRequires for {package}:\n"
                    + "\n".join(transaction.get_resolve_logs_as_strings())
                )

            sources.update(
                item.get_package().get_source_name()
                for item in transaction.get_transaction_packages()
            )
            sources.intersection_update(selected)
            sources.discard(package)
            return BuildDependencies(sources, unavailable)


        def build_batches(dependencies, cycle_heads):
            graph = {package: set(deps.sources) for package, deps in dependencies.items()}
            for head, members in cycle_heads.items():
                if head not in graph:
                    continue
                members = members & graph.keys()
                try:
                    TopologicalSorter({
                        package: graph[package] & members for package in members
                    }).prepare()
                except CycleError:
                    if dependencies[head].unavailable & members:
                        raise RuntimeError(
                            f"Cannot bootstrap {head}: it requires new artifacts "
                            "from another member of its cycle"
                        )
                    graph[head].difference_update(members)
                    for package in members - {head}:
                        graph[package].add(head)
                    print(f"Bootstrap cycle with {head}: {', '.join(sorted(members))}")

            sorter = TopologicalSorter(graph)
            try:
                sorter.prepare()
            except CycleError as error:
                raise RuntimeError(
                    "Dependency cycle remains; configure cycle_heads: "
                    + " -> ".join(error.args[1])
                ) from None

            batches = []
            while sorter.is_active():
                ready = sorted(sorter.get_ready())
                batches.append(ready)
                sorter.done(*ready)
            return batches


        def build_timeout(client, owner, project, package):
            longest = None
            for build in client.build_proxy.get_list(owner, project, package):
                try:
                    duration = int(build.get("ended_on")) - int(build.get("started_on"))
                except (TypeError, ValueError):
                    continue
                if duration >= 0:
                    longest = max(longest or 0, duration)
            return DEFAULT_TIMEOUT if longest is None else longest + TIMEOUT_MARGIN


        def submit_batches(client, owner, project, chroot, batches, srpms):
            timeouts = {
                package: build_timeout(client, owner, project, package) for package in srpms
            }
            batch_options = {}
            for number, batch in enumerate(batches, start=1):
                print(f"Copr batch {number}: {', '.join(batch)}")
                for package in batch:
                    build = client.build_proxy.create_from_file(
                        ownername=owner,
                        projectname=project,
                        path=str(srpms[package]),
                        buildopts={
                            "chroots": [chroot],
                            "timeout": timeouts[package],
                            **batch_options,
                        },
                    )
                    print(f"Submitted {package} as build {build.id}")
                    batch_options = {"with_build_id": build.id}
                # Any build in a Copr batch identifies the whole batch.
                batch_options = {"after_build_id": build.id}


        def repository_info(client):
            os_release = platform.freedesktop_os_release()
            return (
                client.config["username"],
                "${{ github.repository }}".split("/", 1)[1].partition("-")[2],
                "-".join((os_release["ID"], os_release["VERSION_ID"], platform.machine())),
            )


        def main():
            srpms = source_packages()
            providers, cycle_heads = load_build_config()
            client = Client.create_from_config_file("copr-api")
            owner, project, chroot = repository_info(client)
            solver = create_solver(
                client.project_chroot_proxy.get_build_config(owner, project, chroot)["repos"]
            )
            batches = build_batches(
                {
                    package: resolve_dependencies(solver, package, srpm, srpms, providers)
                    for package, srpm in srpms.items()
                },
                cycle_heads,
            )
            submit_batches(client, owner, project, chroot, batches, srpms)


        main()
      shell: python

    - name: Open Issue
      if: env.failure
      uses: actions/github-script@v8
      with:
        script: |
          const failure = process.env.failure.split(' ');
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Failed to rebuild some packages',
            body: `The following packages failed to rebuild:

          ${failure.map(pkg => `- ${pkg}`).join('\n')}

          Please check and update the patches.`,
            labels: ['ci'],
            assignees: [context.repo.owner],
          });
